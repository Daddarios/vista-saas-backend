services:
  api:
    image: vistacore-api:latest
    build:
      context: ./Vista.Core
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Server=sqlserver;Database=VistaCoreDB;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=true
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=VistaCRM
      - Jwt__Audience=VistaCRM
      - Jwt__ExpireMinutes=60
      - Redis__Configuration=redis:6379
      - SmtpSettings__Host=${SMTP_HOST}
      - SmtpSettings__Port=${SMTP_PORT}
      - SmtpSettings__User=${SMTP_EMAIL}
      - SmtpSettings__Pass=${SMTP_PASSWORD}
      - Vika__OllamaEndpoint=http://ollama:11434
      - Vika__Model=qwen2.5-coder:1.5b
      - Vika__QdrantEndpoint=http://qdrant:6333
      - Vika__EmbeddingModel=nomic-embed-text
      - Cors__AllowedOrigins__0=${FRONTEND_ORIGIN_1}
      - Cors__AllowedOrigins__1=${FRONTEND_ORIGIN_2}
    volumes:
      - ./Vista.Core/.VikaRules.md:/app/.VikaRules.md:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
      qdrant:
        condition: service_started
    volumes:
      - app-storage:/app/Storage
      - app-logs:/app/Logs
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_PASSWORD}
      - MSSQL_PID=Express
      - MSSQL_MEMORY_LIMIT_MB=2048
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: vistacore-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vistacore-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  sql-data:
  redis-data:
  app-storage:
  app-logs:
  ollama-data:
  qdrant-data:
