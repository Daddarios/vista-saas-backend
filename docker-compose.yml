services:
  api:
    image: vistacore-api:latest
    build:
      context: ./Vista.Core
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=VistaCoreDB;Username=postgres;Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=VistaCRM
      - Jwt__Audience=VistaCRM
      - Jwt__ExpireMinutes=60
      - SmtpSettings__Host=${SMTP_HOST}
      - SmtpSettings__Port=${SMTP_PORT}
      - SmtpSettings__User=${SMTP_EMAIL}
      - SmtpSettings__Pass=${SMTP_PASSWORD}
      - Vika__GroqApiKey=${GROQ_API_KEY}
      - Vika__Model=llama-3.1-8b-instant
      - SEED_ADMIN=true
      # - Redis__Configuration=redis:6379
      # - Vika__OllamaEndpoint=http://ollama:11434
      # - Vika__QdrantEndpoint=http://qdrant:6333
      # - Vika__EmbeddingModel=nomic-embed-text
      - Cors__AllowedOrigins__0=${FRONTEND_ORIGIN_1}
      - Cors__AllowedOrigins__1=${FRONTEND_ORIGIN_2}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./Vista.Core/.VikaRules.md:/app/.VikaRules.md:ro
      - app-storage:/app/Storage
      - app-logs:/app/Logs
    restart: unless-stopped

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=VistaCoreDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d VistaCoreDB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

